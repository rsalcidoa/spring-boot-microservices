server:
  port: 9090

spring:
  application:
    name: msvc-course
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:courseDB
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: create
    database: H2
    database-platform: org.hibernate.dialect.H2Dialect

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka