server:
  port: 9080

spring:
  application:
    name: msvc-student
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:studentDB
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: create
    database: H2
    database-platform: org.hibernate.dialect.H2Dialect
  config:
    import: optional:configserver:http://localhost:8888

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka